# Copy/adapt into implemented repo. These image tags do not yet exist.
# Pin built release digests before shipping. This is not a runnable app bundle.
services:
  app:
    image: aha-app:release
    pull_policy: never
    user: "10001:10001"
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=256m,mode=1777"]
    volumes: ["cases:/data/cases", "jobs:/data/jobs"]
    environment:
      AHA_CASE_ROOT: /data/cases
      AHA_BIND_HOST: 0.0.0.0
      AHA_ALLOWED_HOSTS: localhost,127.0.0.1
      AHA_ALLOWED_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
      AHA_REMOTE_MODELS_ENABLED: "false"
      AHA_TELEMETRY: "false"
    networks: [isolated]
    healthcheck:
      test: ["CMD", "aha", "healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  worker:
    image: aha-worker:release
    pull_policy: never
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=512m,mode=1777"]
    volumes: ["jobs:/data/jobs"]
    networks: [isolated]
    mem_limit: 2g
    cpus: 1
    restart: unless-stopped
volumes:
  cases:
  jobs:
networks:
  isolated:
    internal: true
# Worker job spool contains bounded copies of permitted inputs, never the whole case.
# App is sole DB writer. Worker communication must use authenticated internal RPC.
# Configure a local model sidecar on this isolated network with explicit approved weights.
